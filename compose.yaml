services:

  postgres:
    image: postgres:16
    container_name: payflow-postgres

    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow_dev_password

    ports:
      - "5432:5432"

    volumes:
      - payflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  payflow_postgres_data:

